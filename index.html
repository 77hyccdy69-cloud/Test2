<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rankly – Deine persönlichen Ranglisten</title>
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏆%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1e2230; --line:#2a2f40;
  --text:#eceef5; --muted:#8c93a8; --accent:#7c5cff; --accent2:#ff5c93;
  --gold:#f5c542; --silver:#c3cad8; --bronze:#d58a52;
  --radius:14px;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f4f5f9;--panel:#fff;--panel2:#eef0f6;--line:#dfe2ec;--text:#161925;--muted:#667089}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand-logo{font-size:26px}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--c,var(--accent))}
.nav-item .emo{font-size:18px;width:24px;text-align:center}
.nav-item .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.nav-sep{height:1px;background:var(--line);margin:6px 0}
.side-foot{display:flex;gap:6px}

/* Buttons */
.btn{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#c0364f}
.btn.small{padding:5px 10px;font-size:13px}
.btn.full{width:100%}
.icon-btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;width:36px;height:36px;cursor:pointer}
.menu-btn{display:none}

/* Main */
.main{padding:24px clamp(14px,3vw,36px) 60px;max-width:1100px;width:100%}
.topbar{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.title-wrap{flex:1}
h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.02em}
.topbar p{margin:2px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}

/* Search */
.searchbox{position:relative;margin-bottom:22px;z-index:20}
.search-input{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px 8px 16px}
.search-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #7c5cff33}
.search-input input{flex:1;background:none;border:0;outline:0;padding:6px 0;font-size:16px}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 20px 50px #0007;max-height:70vh;overflow:auto}
.res{display:flex;gap:12px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res:hover,.res.focus{background:var(--panel2)}
.res img,.res .ph{width:46px;height:68px;object-fit:cover;border-radius:6px;flex:none;background:var(--panel2)}
.res b{display:block}
.res .desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res .src{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.res-msg{padding:16px;color:var(--muted);text-align:center}

/* Placeholder poster */
.ph{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;background:linear-gradient(135deg,var(--c1,#555),var(--c2,#333))}

/* Ranking list */
.podium{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;align-items:end}
.pod{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s}
.pod:hover{transform:translateY(-3px)}
.pod .pimg{aspect-ratio:2/3;width:100%;object-fit:cover;display:block}
.pod .ph.pimg{font-size:48px}
.pod .pinfo{padding:10px 12px}
.pod .pinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .medal{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a1a1a;box-shadow:0 4px 12px #0006}
.pod.p1{order:2;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 12px 40px #f5c54233}
.pod.p2{order:1}.pod.p3{order:3}
.p1 .medal{background:var(--gold)}.p2 .medal{background:var(--silver)}.p3 .medal{background:var(--bronze)}
.pod .sc{position:absolute;top:8px;right:8px}

.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:44px 74px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px 10px 8px;cursor:pointer;transition:border-color .15s,background .15s}
.row:hover{border-color:var(--accent)}
.row.dragging{opacity:.4}
.row.over{border-color:var(--accent2);background:var(--panel2)}
.rank{text-align:center;font-weight:800;font-size:22px;color:var(--muted);cursor:grab;user-select:none}
.rank small{display:block;font-size:11px;font-weight:400;opacity:.6}
.r1 .rank{color:var(--gold)}.r2 .rank{color:var(--silver)}.r3 .rank{color:var(--bronze)}
.row img,.row .ph{width:74px;height:108px;object-fit:cover;border-radius:8px;background:var(--panel2)}
.row .info{min-width:0}
.row .t{font-weight:700;font-size:17px;line-height:1.25}
.row .meta{color:var(--muted);font-size:13px;margin-bottom:4px}
.row .d{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.score{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.score.none{color:var(--muted);font-weight:400}
.score.hi{background:#1f8a5b33;border-color:#1f8a5b}
.score.mid{background:#c9a22733;border-color:#c9a227}
.score.lo{background:#c0364f33;border-color:#c0364f}

/* Gallery */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{position:relative;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .im{aspect-ratio:2/3;width:100%;object-fit:cover;display:block}
.tile .ph.im{font-size:40px}
.tile .tn{position:absolute;left:8px;top:8px;background:#000a;color:#fff;border-radius:8px;padding:1px 8px;font-weight:800}
.tile .ti{padding:8px 10px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Home overview */
.home-cat{margin-bottom:28px}
.home-cat h2{display:flex;align-items:center;gap:8px;font-size:18px;margin:0 0 10px;cursor:pointer}
.home-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.home-strip .tile{width:130px;flex:none}
.empty{text-align:center;padding:60px 20px;color:var(--muted);border:2px dashed var(--line);border-radius:var(--radius)}
.empty .big{font-size:48px}

/* Modal */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.modal[hidden],.results[hidden],.toast[hidden]{display:none}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(720px,100%);max-height:94vh;overflow:auto;padding:22px}
.modal-card h2{margin:0 0 14px}
.detail{display:grid;grid-template-columns:200px 1fr;gap:20px}
.detail .cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--panel2)}
.detail .ph.cover{font-size:64px}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
label.f > input,label.f > textarea,label.f > select{display:block;width:100%;margin-top:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text)}
textarea{resize:vertical;min-height:90px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
.scorebar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.scorebar input[type=range]{flex:1;accent-color:var(--accent)}
.scorebar output{min-width:48px;text-align:center;font-weight:800;font-size:20px}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.emoji-pick button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer}
.emoji-pick button.on{border-color:var(--accent);background:#7c5cff33}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 12px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:999px;z-index:200;box-shadow:0 10px 30px #0008}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 40px #0008}
  .sidebar.open{transform:none}
  .menu-btn{display:block}
  .row{grid-template-columns:34px 58px 1fr;}
  .row .score{grid-column:3}
  .row img,.row .ph{width:58px;height:86px}
  .detail{grid-template-columns:1fr}
  .detail .cover{max-width:180px}
  .podium{gap:8px}
}
</style>
</head>
<body>
<noscript><div style="padding:16px;background:#c0364f;color:#fff;font:16px system-ui;position:relative;z-index:999">JavaScript ist hier deaktiviert (z. B. in einer Datei-Vorschau). Bitte die Seite in Safari/Chrome über eine echte Web-Adresse öffnen, nicht als Anhang oder Vorschau.</div></noscript>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-logo">🏆</span><span>Rankly</span></div>
    <nav id="nav"></nav>
    <button class="btn ghost full" id="addCatBtn">＋ Neue Kategorie</button>
    <div class="side-foot">
      <button class="btn ghost small" id="settingsBtn">⚙️ Einstellungen</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü">☰</button>
      <div class="title-wrap">
        <h1 id="viewTitle"></h1>
        <p id="viewSub" class="muted"></p>
      </div>
      <div class="tools" id="tools"></div>
    </header>

    <section class="searchbox" id="searchBox">
      <div class="search-input">
        <span>🔍</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Titel suchen und zum Ranking hinzufügen …">
        <button class="btn ghost small" id="manualBtn" title="Ohne Suche manuell anlegen">Manuell</button>
      </div>
      <div class="results" id="results" hidden></div>
    </section>

    <section id="content"></section>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modalCard"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ======================= Helfer ======================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const clean = h => {
  const s = String(h || '').replace(/<br\s*\/?>/gi, ' ').replace(/<\/p>/gi, ' ');
  const t = new DOMParser().parseFromString(s, 'text/html').body.textContent || '';
  return t.replace(/\s+/g, ' ').trim();
};
const safeUrl = u => (/^(https?:\/\/|data:image\/)/i.test(u || '') ? u : '');
const toast = (msg) => {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
};
async function getJSON(url, opt = {}) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 10000);
  try {
    const r = await fetch(url, { ...opt, signal: c.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ======================= Datenhaltung ======================= */
const KEY = 'rankly.v1';
const COLORS = ['#7c5cff', '#ff5c93', '#2dd4bf', '#f5a524', '#4ea1ff', '#7ed957', '#ff7a45', '#c084fc'];
const EMOJIS = ['🎬', '📺', '🌸', '🎮', '📚', '🎵', '🍕', '✈️', '⚽', '🍺', '🎲', '🌍', '🐶', '🚗', '💻', '⭐'];
const SOURCES = {
  movie: 'Filme',
  tv: 'Serien',
  anime: 'Anime',
  game: 'Spiele',
  book: 'Bücher',
  wiki: 'Alles andere (Wikipedia)',
};
const defaults = () => ({
  categories: [
    { id: uid(), name: 'Filme', emoji: '🎬', color: COLORS[0], source: 'movie', sort: 'manual', view: 'list' },
    { id: uid(), name: 'Serien', emoji: '📺', color: COLORS[1], source: 'tv', sort: 'manual', view: 'list' },
    { id: uid(), name: 'Anime', emoji: '🌸', color: COLORS[7], source: 'anime', sort: 'manual', view: 'list' },
    { id: uid(), name: 'Spiele', emoji: '🎮', color: COLORS[2], source: 'game', sort: 'manual', view: 'list' },
  ],
  items: [],
  settings: { tmdb: '', rawg: '' },
  last: 'home',
});
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch { S = null; }
  if (!S || !Array.isArray(S.categories)) S = defaults();
  S.items = S.items || []; S.settings = S.settings || { tmdb: '', rawg: '' };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch { toast('⚠️ Speichern fehlgeschlagen (Speicher voll?)'); }
}
const cat = id => S.categories.find(c => c.id === id);
const manual = cid => S.items.filter(i => i.catId === cid).sort((a, b) => a.order - b.order);
function ranked(c) {
  const l = manual(c.id);
  if (c.sort !== 'score') return l;
  return l.map((i, n) => [i, n]).sort((a, b) => (b[0].score ?? -1) - (a[0].score ?? -1) || a[1] - b[1]).map(x => x[0]);
}
const setOrder = ids => ids.forEach((id, n) => { S.items.find(i => i.id === id).order = n; });

/* ======================= Datenquellen (Bilder + Beschreibung) ======================= */
const strip = t => t.replace(/\s*\([^)]*\)\s*$/, '').trim();

async function wikiLang(lang, q) {
  const p = new URLSearchParams({
    action: 'query', format: 'json', origin: '*', generator: 'search', gsrsearch: q, gsrlimit: '6',
    prop: 'pageimages|extracts|info', inprop: 'url', piprop: 'thumbnail', pithumbsize: '500',
    exintro: '1', explaintext: '1', exsentences: '4',
  });
  const j = await getJSON(`https://${lang}.wikipedia.org/w/api.php?${p}`);
  return Object.values(j.query?.pages || {})
    .sort((a, b) => a.index - b.index)
    .filter(p => !/Begriffsklärung|disambiguation|^Liste |^List of /i.test(p.title))
    .map(p => ({
      title: strip(p.title), image: p.thumbnail?.source || '', desc: clean(p.extract),
      link: p.fullurl, src: 'Wikipedia ' + lang.toUpperCase(),
    }));
}
const wiki = (hintDe, hintEn) => async q => {
  const [de, en] = await Promise.allSettled([wikiLang('de', `${q} ${hintDe}`.trim()), wikiLang('en', `${q} ${hintEn}`.trim())]);
  const a = de.value || [], b = en.value || [];
  if (!a.length && !b.length && (de.status === 'rejected' && en.status === 'rejected')) throw new Error('wiki');
  const out = [];
  for (let i = 0; i < Math.max(a.length, b.length); i++) { if (a[i]) out.push(a[i]); if (b[i]) out.push(b[i]); }
  return out;
};

const srcTMDB = kind => async q => {
  const k = S.settings.tmdb; if (!k) return [];
  const j = await getJSON(`https://api.themoviedb.org/3/search/${kind}?api_key=${encodeURIComponent(k)}&language=de-DE&query=${encodeURIComponent(q)}`);
  return (j.results || []).slice(0, 8).map(r => ({
    title: r.title || r.name, year: (r.release_date || r.first_air_date || '').slice(0, 4),
    image: r.poster_path ? 'https://image.tmdb.org/t/p/w500' + r.poster_path : '',
    desc: r.overview || '', link: `https://www.themoviedb.org/${kind}/${r.id}`, src: 'TMDB',
  }));
};
async function srcItunesMovie(q) {
  const j = await getJSON(`https://itunes.apple.com/search?media=movie&entity=movie&country=de&lang=de_de&limit=8&term=${encodeURIComponent(q)}`);
  return (j.results || []).map(r => ({
    title: r.trackName, year: (r.releaseDate || '').slice(0, 4),
    image: (r.artworkUrl100 || '').replace('100x100bb', '600x900bb'),
    desc: r.longDescription || r.shortDescription || '', link: r.trackViewUrl, src: 'iTunes',
  }));
}
async function srcTVmaze(q) {
  const j = await getJSON(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
  return j.slice(0, 8).map(({ show: s }) => ({
    title: s.name, year: (s.premiered || '').slice(0, 4),
    image: s.image?.original || s.image?.medium || '', desc: clean(s.summary), link: s.url, src: 'TVmaze',
  }));
}
async function srcAniList(q) {
  const query = `query($s:String){Page(perPage:8){media(search:$s,type:ANIME,sort:SEARCH_MATCH){title{romaji english} startDate{year} format coverImage{large extraLarge} description(asHtml:false) siteUrl}}}`;
  try {
    const j = await getJSON('https://graphql.anilist.co', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ query, variables: { s: q } }),
    });
    return j.data.Page.media.map(m => ({
      title: m.title.english || m.title.romaji, year: m.startDate?.year || '',
      image: m.coverImage.extraLarge || m.coverImage.large, desc: clean(m.description),
      link: m.siteUrl, src: 'AniList', sub: m.format,
    }));
  } catch { // Fallback: Jikan (MyAnimeList)
    const j = await getJSON(`https://api.jikan.moe/v4/anime?limit=8&q=${encodeURIComponent(q)}`);
    return (j.data || []).map(m => ({
      title: m.title_english || m.title, year: m.year || '', image: m.images?.jpg?.large_image_url || '',
      desc: clean(m.synopsis), link: m.url, src: 'MyAnimeList', sub: m.type,
    }));
  }
}
async function srcRAWG(q) {
  const k = S.settings.rawg; if (!k) return [];
  const j = await getJSON(`https://api.rawg.io/api/games?key=${encodeURIComponent(k)}&page_size=8&search=${encodeURIComponent(q)}`);
  return (j.results || []).map(g => ({
    title: g.name, year: (g.released || '').slice(0, 4), image: g.background_image || '',
    link: `https://rawg.io/games/${g.slug}`, src: 'RAWG',
    lazyDesc: async () => clean((await getJSON(`https://api.rawg.io/api/games/${g.id}?key=${encodeURIComponent(k)}`)).description_raw || ''),
  }));
}
async function srcOpenLibrary(q) {
  const j = await getJSON(`https://openlibrary.org/search.json?limit=8&fields=key,title,author_name,first_publish_year,cover_i&q=${encodeURIComponent(q)}`);
  return (j.docs || []).map(d => ({
    title: d.title, year: d.first_publish_year || '', sub: (d.author_name || [])[0] || '',
    image: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg` : '',
    link: 'https://openlibrary.org' + d.key, src: 'Open Library',
    lazyDesc: async () => {
      const w = await getJSON(`https://openlibrary.org${d.key}.json`);
      return clean(typeof w.description === 'string' ? w.description : w.description?.value || '');
    },
  }));
}
const PIPELINE = {
  movie: [srcTMDB('movie'), srcItunesMovie, wiki('Film', 'film')],
  tv: [srcTMDB('tv'), srcTVmaze, wiki('Fernsehserie', 'TV series')],
  anime: [srcAniList, wiki('Anime', 'anime')],
  game: [srcRAWG, wiki('Videospiel', 'video game')],
  book: [srcOpenLibrary, wiki('Buch', 'book')],
  wiki: [wiki('', '')],
};
async function searchAll(source, q) {
  const fns = PIPELINE[source] || PIPELINE.wiki;
  const res = await Promise.allSettled(fns.map(f => f(q)));
  const seen = new Set(), out = [];
  res.forEach(r => (r.value || []).forEach(x => {
    if (!x.title) return;
    const k = x.title.toLowerCase() + '|' + x.year;
    if (seen.has(k)) return; seen.add(k); out.push(x);
  }));
  // Treffer mit Bild vor Treffern ohne Bild, Reihenfolge der Quellen bleibt sonst erhalten
  out.sort((a, b) => !!b.image - !!a.image);
  return { results: out.slice(0, 14), failed: res.every(r => r.status === 'rejected') };
}

/* ======================= UI-Bausteine ======================= */
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function poster(item, cls) {
  const img = safeUrl(item.image);
  if (img) return `<img class="${cls}" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=window.phHTML(this.dataset.t,'${cls}')" data-t="${esc(item.title)}">`;
  return phHTML(item.title, cls);
}
window.phHTML = (title, cls) => {
  const h = hue(title || '?');
  return `<div class="ph ${cls}" style="--c1:hsl(${h} 55% 45%);--c2:hsl(${(h + 50) % 360} 55% 30%)">${esc((title || '?').trim().charAt(0).toUpperCase())}</div>`;
};
const scoreCls = s => (s >= 8 ? 'hi' : s >= 5 ? 'mid' : 'lo');
const scoreHTML = it => it.score == null ? '<span class="score none">unbewertet</span>' : `<span class="score ${scoreCls(it.score)}">★ ${it.score.toFixed(1).replace('.', ',')}</span>`;
const metaOf = it => [it.year, it.sub].filter(Boolean).join(' · ');

function shrink(file) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const w = Math.min(500, im.width), h = Math.round(im.height * w / im.width);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h); res(cv.toDataURL('image/jpeg', .82));
      };
      im.onerror = () => res(''); im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ======================= Suche ======================= */
function renderResults(box, results, failed, onPick) {
  if (!results.length) {
    box.innerHTML = `<div class="res-msg">${failed ? '⚠️ Keine Verbindung zu den Datenquellen. Du kannst den Eintrag manuell anlegen.' : 'Keine Treffer – probiere einen anderen Titel oder lege den Eintrag manuell an.'}</div>`;
    return;
  }
  box.innerHTML = results.map((r, n) => `<div class="res" data-n="${n}">${poster(r, 'rimg')}<div style="min-width:0"><b>${esc(r.title)} <span class="muted" style="font-weight:400">${esc([r.year, r.sub].filter(Boolean).join(' · '))}</span></b><div class="desc">${esc(r.desc) || '<i>keine Beschreibung</i>'}</div><span class="src">${esc(r.src)}</span></div></div>`).join('');
  box.onclick = e => { const el = e.target.closest('.res'); if (el) onPick(results[+el.dataset.n]); };
}
let lastRes = [], searchSeq = 0, timer;
function onSearch() {
  clearTimeout(timer);
  const q = $('#searchInput').value.trim(), box = $('#results');
  if (q.length < 2) { box.hidden = true; return; }
  box.hidden = false; box.innerHTML = '<div class="res-msg">Suche läuft …</div>';
  timer = setTimeout(async () => {
    const seq = ++searchSeq, c = cat(view); if (!c) return;
    const { results, failed } = await searchAll(c.source, q);
    if (seq !== searchSeq) return;
    lastRes = results;
    renderResults(box, results, failed, r => addFromResult(c, r));
  }, 350);
}
async function addFromResult(c, r) {
  if (S.items.some(i => i.catId === c.id && i.title.toLowerCase() === r.title.toLowerCase() && String(i.year) === String(r.year || ''))) {
    toast('Dieser Eintrag ist schon in der Liste'); return;
  }
  $('#results').hidden = true; $('#searchInput').value = '';
  let desc = r.desc;
  if (!desc && r.lazyDesc) { toast('Lade Beschreibung …'); desc = await r.lazyDesc().catch(() => ''); }
  const item = { id: uid(), catId: c.id, title: r.title, year: r.year || '', sub: r.sub || '', image: r.image || '', desc: desc || '', link: r.link || '', score: null, note: '', order: 0 };
  itemModal(item, true); // direkt Bewertung vergeben können
}

/* ======================= Events ======================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); const act = t?.dataset.act;
  if (!e.target.closest('#searchBox')) $('#results').hidden = true;
  if (e.target.id === 'modal') return closeModal();
  if (!act) return;
  const c = cat(view);
  if (act === 'go') { e.preventDefault(); view = t.dataset.id; S.last = view; save(); $('#sidebar').classList.remove('open'); render(); window.scrollTo(0, 0); }
  else if (act === 'open') { const it = S.items.find(i => i.id === t.dataset.id); if (it) itemModal(it, false); }
  else if (act === 'close') closeModal();
  else if (act === 'sort') { c.sort = t.dataset.v; save(); render(); }
  else if (act === 'vw') { c.view = t.dataset.v; save(); render(); }
  else if (act === 'editcat') catModal(c);
});

/* Drag & Drop (Eigene Reihenfolge) */
let dragId = null;
document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('[data-drag]'); if (!el) return;
  dragId = el.dataset.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
});
document.addEventListener('dragover', e => {
  const el = e.target.closest?.('[data-drag]'); if (!el || !dragId) return;
  e.preventDefault(); document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); el.classList.add('over');
});
document.addEventListener('drop', e => {
  const el = e.target.closest?.('[data-drag]'); if (!el || !dragId) return;
  e.preventDefault();
  const c = cat(view), ids = manual(c.id).map(i => i.id), from = ids.indexOf(dragId), to = ids.indexOf(el.dataset.id);
  if (from >= 0 && to >= 0 && from !== to) { ids.splice(from, 1); ids.splice(to, 0, dragId); setOrder(ids); save(); }
  dragId = null; render();
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); });

/* ======================= Start ======================= */
load();
view = S.last || 'home';
render();
</script>
</body>
